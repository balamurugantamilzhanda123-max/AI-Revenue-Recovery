services:
  - type: web
    name: reviveai-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: AUTO_CREATE_TABLES
        value: "true"
      - key: CORS_ORIGINS
        value: "https://ai-revenue-recovery.vercel.app,https://reviveai.vercel.app,http://localhost:3000"
      - key: PAYMENT_GATEWAY_MODE
        value: "TEST"
      - key: MAX_AUTOMATIC_RETRIES
        value: "1"
      - key: MAX_RECOVERY_MESSAGES
        value: "2"
      - key: LOW_CONFIDENCE_THRESHOLD
        value: "0.70"

